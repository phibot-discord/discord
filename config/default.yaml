# Copy to config/local.yaml and set token.
discord:
  token: ""
  clientId: ""
  # Slash commands: "global" or a guild id for faster iteration
  guildId: ""
  # Gateway shards: auto (Discord's recommendation) or an integer
  shards: auto
  # true = one process per shard (ShardingManager). false = all shards in this process
  shardProcesses: true

# Discord user ids that can use /bot admin commands and /phi admin …
admins:
  - ""

# Account + namespace can live here; put the API token in CLOUDFLARE_API_TOKEN.
kv:
  accountId: ""
  namespaceId: ""
  apiToken: ""

# Jackets come from the local clone made by `/phi admin downill`
# (phi-assets/original_ill); avatars and icons are bundled in phi-assets/html.
# Optional: set bucket (and its public domain) to fill in anything missing
# locally from the WebUI's R2 bucket, and to share finished cards with the web.
r2:
  bucket: ""
  publicBase: ""

paths:
  data: "./data"
  plugins: "./plugins"
  # Vendored card HTML/CSS/fonts/images in phi-assets/
  phiResources: "./phi-assets"

render:
  format: jpeg
  quality: 90
  width: 1200
  scale: 1
